# Deploy to GitHub Pages
#
# Publica `dist/` en GitHub Pages. El proyecto vive en un subpath
# (/kanam-sudoku-iphone/), asi que TODAS las rutas del build son relativas
# (base: "./"). Ver ADR-0005.
#
# Para activarlo hace falta, en el repo de GitHub:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Sin eso, el workflow corre el build pero no publica.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
